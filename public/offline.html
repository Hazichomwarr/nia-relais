<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#255b48" />
    <title>NIA — Hors ligne</title>
    <style>
      :root { color: #183f33; background: #f2f7f3; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); text-align: center; background: #fffdfa; border: 1px solid #dce8df; border-radius: 24px; padding: 40px 28px; box-sizing: border-box; box-shadow: 0 14px 42px rgba(24, 63, 51, .08); }
      img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 16px; }
      h1 { margin: 0; font: 700 30px Georgia, serif; color: #255b48; }
      p { margin: 16px 0 0; color: #49655b; line-height: 1.55; }
      .en { border-top: 1px solid #dce8df; margin-top: 24px; padding-top: 20px; }
      button { margin-top: 28px; border: 0; border-radius: 999px; background: #255b48; color: white; cursor: pointer; font: inherit; font-weight: 700; padding: 13px 24px; }
      button:focus-visible { outline: 3px solid #c65a32; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/nia-logo.png" alt="NIA" />
      <h1>Vous êtes hors ligne</h1>
      <p>NIA a besoin d’une connexion Internet pour afficher vos informations d’épargne les plus récentes. Reconnectez-vous puis réessayez.</p>
      <p class="en" lang="en"><strong>You’re offline</strong><br />NIA needs an internet connection to show your latest savings information. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Réessayer / Retry</button>
    </main>
  </body>
</html>
